<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Protocolo HTTP & Spring MVC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h1>Laboratório HTTP</h1>
    <div th:if="${resultadoBusca}" class="alert alert-info" th:text="${resultadoBusca}"></div>
    <div th:if="${mensagemRecebida}" class="alert alert-success" th:text="${mensagemRecebida}"></div>
    
    <div class="row mt-4">
        <div class="col-md-6">
            <h3>Testar GET</h3>
            <form th:action="@{/demo/buscar}" method="get">
                <input type="text" name="termo" class="form-control mb-2" placeholder="Termo de busca">
                <button type="submit" class="btn btn-primary">Buscar</button>
            </form>
            
            <h4 class="mt-4">Status Codes</h4>
            <a href="/demo/status?tipo=ok" class="btn btn-outline-success">200 OK</a>
            <a href="/demo/status?tipo=erro" class="btn btn-outline-danger">500 Error</a>
            <a href="/demo/status?tipo=nao-encontrado" class="btn btn-outline-secondary">404 Not Found</a>
        </div>
        <div class="col-md-6">
            <h3>Testar POST</h3>
            <form th:action="@{/demo/processar}" method="post">
                <input type="text" name="mensagem" class="form-control mb-2" required placeholder="Mensagem">
                <button type="submit" class="btn btn-success">Enviar POST</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
